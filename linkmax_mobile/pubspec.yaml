name: linkmax_mobile
description: "LinkMAX — clean and simple link manager for Android."
publish_to: 'none'

version: 1.1.1+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  http: ^1.6.0
  file_picker: ^13.3.0
  crypto: ^3.0.8
  html: ^0.15.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "../build/icon-256.png"
  adaptive_icon_background: "#8B5CF6"
  adaptive_icon_foreground: "assets/icon-foreground.png"
  android: true
  ios: false

flutter:

  uses-material-design: true

  assets:
    - assets/icon-32.png
    - assets/icon-foreground.png
